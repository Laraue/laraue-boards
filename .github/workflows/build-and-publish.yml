name: Build and publish Nuxt app

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format
      - name: Check styles
        run: pnpm style
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build SSR app
        env:
          NUXT_PUBLIC_BOARDS_API_BASE_URL: ${{ vars.BOARDS_API_BASE_URL }}
        run: test -n "$NUXT_PUBLIC_BOARDS_API_BASE_URL" && pnpm build

      - name: Pack build output
        if: github.ref == 'refs/heads/master'
        run: tar -czf laraue.tar.gz -C .output .

      - name: Upload
        if: github.ref == 'refs/heads/master'
        uses: marcodallasanta/ssh-scp-deploy@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }} # "example.com"
          port: ${{ secrets.SSH_PORT }} # 22
          user: ${{ secrets.SSH_USER }} # "user"
          password: ${{ secrets.SSH_PASSWORD }} # "password"
          local: laraue.tar.gz
          remote: '/home/laraue/frontend/boards'
          post_upload:
            cd /home/laraue/frontend/boards && find . -mindepth 1 ! -name laraue.tar.gz -delete &&
            tar -xzf laraue.tar.gz && rm laraue.tar.gz
