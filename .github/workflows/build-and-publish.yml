name: Build and publish Nuxt app

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # Playwright's recommended docker flags: chromium runs out of memory without the
      # host IPC namespace, and --init reaps the browser processes it leaves behind.
      options: --ipc=host --init

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format
      - name: Check styles
        run: pnpm style
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build SSR app
        run: pnpm build

      - name: Pack build output
        if: github.ref == 'refs/heads/master'
        run: tar -czf laraue.tar.gz -C .output .

      - name: Upload build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: boards-frontend
          path: laraue.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: boards-frontend-production
    steps:
      - name: Notify deploy started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 Deploy started: Boards Frontend (${{ github.sha }})"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: boards-frontend

      - name: Upload
        uses: marcodallasanta/ssh-scp-deploy@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }} # "example.com"
          port: ${{ secrets.SSH_PORT }} # 22
          user: ${{ secrets.SSH_USER }} # "user"
          password: ${{ secrets.SSH_PASSWORD }} # "password"
          local: laraue.tar.gz
          remote: '/home/laraue/frontend/boards'
          post_upload: |-
            cd /home/laraue/frontend/boards && find . -mindepth 1 ! -name laraue.tar.gz -delete &&
            tar -xzf laraue.tar.gz && rm laraue.tar.gz

      - name: Build container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/laraue && docker build -f BoardsSsrDockerfile -t boardsssrhost .
            docker compose up -d --force-recreate boardsssrhost

      - name: Notify deploy finished
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Deploy finished: Boards Frontend (${{ github.sha }})"

      - name: Notify deploy failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Deploy failed: Boards Frontend (${{ github.sha }})"
